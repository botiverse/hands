name: Inspect Hands Staged Asset
on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Exact build UUID
        required: true
        type: string
      asset_id:
        description: Exact pending asset UUID
        required: true
        type: string
permissions:
  contents: read
jobs:
  inspect:
    environment: reporter-session-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @botiverse/hands-worker...
      - run: node --test scripts/monitoring/inspect-staged-asset.test.mjs
      - name: Inspect one upload with a read-only query and HEAD
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BOTIVERSE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_BOTIVERSE_ACCOUNT_ID }}
          HANDS_D1_DATABASE_ID: ${{ vars.HANDS_D1_DATABASE_ID }}
          HANDS_R2_BUCKET_NAME: ${{ vars.HANDS_R2_BUCKET_NAME }}
          R2_S3_ACCESS_KEY_ID: ${{ secrets.R2_S3_ACCESS_KEY_ID }}
          R2_S3_SECRET_ACCESS_KEY: ${{ secrets.R2_S3_SECRET_ACCESS_KEY }}
          QUERY_BUILD_ID: ${{ inputs.build_id }}
          QUERY_ASSET_ID: ${{ inputs.asset_id }}
        run: node worker/scripts/inspect-staged-asset.mjs
