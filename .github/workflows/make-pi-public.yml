name: make-pi-public
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Set package public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm access get status @botiverse/pi-coding-agent || true
          npm access set status=public @botiverse/pi-coding-agent
          npm access get status @botiverse/pi-coding-agent
          # unauthenticated registry read
          curl -sS "https://registry.npmjs.org/@botiverse%2fpi-coding-agent" | head -c 500
          echo
