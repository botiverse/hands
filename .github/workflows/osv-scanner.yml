name: OSV-Scanner scheduled scan

# Daily dependency vulnerability report (zhiqiang, 2026-11-03). Report only:
# findings go to this job's log and never fail the run. Only a scanner error
# (anything other than "found vulnerabilities" or "no package sources") fails it.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: osv-scanner
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OSV_SCANNER_VERSION: v2.7.0
      OSV_SCANNER_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install osv-scanner
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"

      - name: Scan (report only)
        run: |
          set +e
          "$RUNNER_TEMP/osv-scanner" scan source --recursive --format table ./
          rc=$?
          case "$rc" in
            0) echo "No known vulnerabilities." ;;
            1) echo "::notice::Vulnerabilities found (report only, see the table above)." ;;
            128) echo "::notice::No package sources found to scan." ;;
            *) echo "::error::osv-scanner failed with exit code $rc."; exit "$rc" ;;
          esac
