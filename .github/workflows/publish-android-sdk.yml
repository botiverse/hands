name: Publish Android SDK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SDK version to publish, for example 0.1.0"
        required: true
        default: "0.12.4"
      dry_run:
        description: "Publish the complete SDK to the runner-local Maven repository only."
        required: true
        type: boolean
        default: true
  push:
    tags:
      - "android-sdk-v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install pinned Android NDK
        run: sdkmanager "ndk;26.3.11579264"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#android-sdk-v}"
          else
            VERSION="${INPUT_VERSION}"
          fi
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid Android SDK semantic version: ${VERSION}" >&2
            exit 1
          }
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build SDK and run central publication gate
        env:
          RESOLVED_VERSION: ${{ steps.version.outputs.value }}
        run: gradle -p clients/android testReleaseUnitTest verifyReleaseElfAlignment "-PVERSION_NAME=$RESOLVED_VERSION"

      - name: Verify local and remote publication task graphs
        env:
          HANDS_ANDROID_SDK_TEST_VERSION: ${{ steps.version.outputs.value }}
        run: scripts/test_android_publication_gate.sh

      - name: Upload native symbols as workflow evidence
        uses: actions/upload-artifact@v4
        with:
          name: hands-android-sdk-${{ steps.version.outputs.value }}-native-symbols
          path: clients/android/build/outputs/native-symbols/*-native-symbols.zip
          if-no-files-found: error

      - name: Publish SDK dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        env:
          RESOLVED_VERSION: ${{ steps.version.outputs.value }}
        run: gradle -p clients/android publishToMavenLocal "-PVERSION_NAME=$RESOLVED_VERSION"

      - name: Publish SDK to GitHub Packages
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESOLVED_VERSION: ${{ steps.version.outputs.value }}
        run: gradle -p clients/android publish "-PVERSION_NAME=$RESOLVED_VERSION"

      - name: Summary
        shell: bash
        env:
          RESOLVED_VERSION: ${{ steps.version.outputs.value }}
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          {
            echo "### Android SDK publish"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Package | \`build.hands:hands-android-sdk\` |"
            echo "| Version | \`${RESOLVED_VERSION}\` |"
            echo "| Dry run | \`${DRY_RUN}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
