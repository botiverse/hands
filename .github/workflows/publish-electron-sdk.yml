name: Publish Electron SDK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Electron SDK version to publish. Defaults to clients/electron/package.json."
        required: false
        type: string
      dry_run:
        description: "Run npm publish --dry-run only."
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "electron-sdk-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # npm's trusted publisher for this package is bound to this environment.
    environment: npm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.12.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Use npm with trusted publishing support
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./clients/electron/package.json').version")"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            requested="${GITHUB_REF_NAME#electron-sdk-v}"
          elif [[ -n "${REQUESTED_VERSION:-}" ]]; then
            requested="${REQUESTED_VERSION}"
          else
            requested="${package_version}"
          fi
          if [[ "${requested}" != "${package_version}" ]]; then
            echo "Requested version ${requested} does not match clients/electron/package.json ${package_version}" >&2
            exit 1
          fi
          echo "value=${package_version}" >> "$GITHUB_OUTPUT"

      - name: Verify app-patch dependency is published
        shell: bash
        run: |
          set -euo pipefail
          version="$(node scripts/resolve-workspace-dependency-version.mjs \
            clients/electron/package.json @botiverse/hands-app-patch packages/app-patch/package.json)"
          npm view "@botiverse/hands-app-patch@${version}" version

      - name: Build Electron SDK
        run: |
          pnpm --filter @botiverse/hands-app-patch build
          pnpm --filter @botiverse/hands-electron build

      # pnpm pack rewrites `workspace:*` to the published version; npm publish
      # inside the workspace would ship the literal `workspace:*` specifier.
      - name: Pack Electron SDK
        id: pack
        working-directory: clients/electron
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist-packages"
          pnpm pack --pack-destination "$GITHUB_WORKSPACE/dist-packages"
          package_path="$(find "$GITHUB_WORKSPACE/dist-packages" -maxdepth 1 -name 'botiverse-hands-electron-*.tgz' -print -quit)"
          test -n "${package_path}"
          if tar -xOzf "${package_path}" package/package.json | grep -q '"workspace:'; then
            echo "Packed package.json still has a workspace: specifier" >&2
            exit 1
          fi
          echo "path=${package_path}" >> "$GITHUB_OUTPUT"

      - name: Publish dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: npm publish "$PACKAGE_PATH" --access public --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_PATH: ${{ steps.pack.outputs.path }}

      - name: Publish to npm
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        run: npm publish "$PACKAGE_PATH" --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_PATH: ${{ steps.pack.outputs.path }}

      - name: Summary
        shell: bash
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          RESOLVED_VERSION: ${{ steps.version.outputs.value }}
        run: |
          {
            echo "### Electron SDK publish"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Package | \`@botiverse/hands-electron\` |"
            echo "| Version | \`${RESOLVED_VERSION}\` |"
            echo "| Dry run | \`${DRY_RUN}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
