name: Raft workflow notifier health

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      send_synthetic_alert:
        description: Send one clearly labelled test alert after credential validation
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    environment: raft-workflow-notifications
    env:
      RAFT_SERVER: https://app.raft.build
      RAFT_PROFILE: hands-workflow-notifier
      RAFT_PROFILE_DIR: /tmp/raft-profiles/hands-workflow-notifier
      RAFT_CREDENTIAL_JSON: ${{ secrets.RAFT_NOTIFY_CREDENTIAL_JSON }}
    steps:
      - name: Install pinned Raft CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --prefix "$RUNNER_TEMP/raft-cli" @botiverse/raft@0.0.17

      - name: Materialize isolated profile
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RAFT_CREDENTIAL_JSON"
          umask 077
          mkdir -p "$RAFT_PROFILE_DIR"
          printf '%s' "$RAFT_CREDENTIAL_JSON" > "$RAFT_PROFILE_DIR/credential.json"
          test "$(stat -c '%a' "$RAFT_PROFILE_DIR/credential.json")" = 600

      - name: Verify notifier credential
        shell: bash
        run: |
          set -euo pipefail
          agent_id="$(node -e 'const c=require(process.env.RAFT_PROFILE_DIR+"/credential.json"); process.stdout.write(c.agentId)')"
          "$RUNNER_TEMP/raft-cli/node_modules/.bin/raft" agent login status \
            --server "$RAFT_SERVER" --agent "$agent_id" \
            --profile-slug "$RAFT_PROFILE" --profile-dir "$RAFT_PROFILE_DIR"

      - name: Send synthetic notifier alert
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_synthetic_alert }}
        shell: bash
        run: |
          set -euo pipefail
          printf -v body '%s\n' \
            "Hands workflow notifier synthetic alert: success" \
            "repository: ${GITHUB_REPOSITORY}" \
            "workflow: ${GITHUB_WORKFLOW}" \
            "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "run_id: ${GITHUB_RUN_ID}" \
            "head_sha: ${GITHUB_SHA}"
          cli="$RUNNER_TEMP/raft-cli/node_modules/.bin/raft"
          if ! output=$("$cli" message send --anyway --target "#proj-hands" <<<"$body" 2>&1); then
            printf '%s\n' "$output" >&2
            exit 1
          fi
          grep -Eq "Message (sent|queued)" <<<"$output" || {
            printf 'Notifier delivery was not accepted:\n%s\n' "$output" >&2
            exit 1
          }
          printf '%s\n' "$output"
