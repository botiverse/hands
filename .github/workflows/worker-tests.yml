name: Worker tests

# Nothing ran the worker test suite. Every test result quoted in a review was a
# number someone produced locally, and a local run is evidence about whatever tree it
# happened to be sitting on — which is not necessarily the commit under review. That
# is not hypothetical: a migration fix was destroyed by a `git checkout --` during a
# mutation run, the following commit captured only its test, and the suite result
# reported against that commit had been produced minutes earlier from a working tree
# that no longer existed. A reviewer caught it by reading the Git object.
#
# A run here is bound to the commit by construction, so nobody has to be trusted about
# which tree they were on, and nobody has to remember to check.

on:
  pull_request:
    paths:
      - "worker/**"
      - "play-adapter/**"
      - "migrations/**"
      - "packages/**"
      - ".github/workflows/worker-tests.yml"
      # The root files this job actually reads, enumerated rather than guessed:
      # pnpm/action-setup takes packageManager from the root package.json; the pnpm
      # cache and `install --frozen-lockfile` read the lockfile, the workspace file
      # and that same package.json; worker/tsconfig.json extends tsconfig.base.json.
      # There is no root .npmrc, .nvmrc, .node-version, .pnpmfile.cjs or patches/, so
      # the set is closed at these. A lockfile-only CVE bump and a strict-mode flip in
      # tsconfig.base.json are both real changes that would otherwise skip this job.
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      # Files the suite *asserts on* — a different set from the files the job reads in
      # order to run, and the one this list originally missed. production_config.test.ts
      # opens the deploy workflow and makes claims about it; that path matched nothing
      # above, so a PR touching only it ran no tests. That happened: the reporter-session
      # cleanup deleted the wiring this suite asserted, every check on the PR was green
      # because this suite was not among them, and main went red on the merge commit.
      #
      # The whole directory, not the one file that broke. Listing the asserted files
      # means deriving that list, and a derivation that misses one is silent in the
      # direction of green — the same failure this entry exists to fix, one level up.
      # A wildcard has nothing to miss.
      #
      # The cost of erring wide is measured, not assumed: the last eight runs of this
      # job took 28-42s, median 35. Thirty-five seconds on an unrelated workflow edit is
      # affordable waste; a guard that silently does not run is an unobservable failure.
      # `paths` is a performance optimisation and was being used as a correctness
      # boundary.
      #
      # "No test ran" and "every test passed" are the same green on a pull request page.
      - ".github/workflows/**"
      # cors_allow_headers.test.ts scans container/src and container/package.json
      # (SOURCE_DIRS, MANIFESTS) because the container has no cors() today and its own
      # suite does not run here. Without this entry, a PR touching only container/ does
      # not run it — and a PR introducing the first cors() call is, almost by definition,
      # a PR touching only container/. The instrument would have been absent from exactly
      # the change it exists to catch. Its own `registrations.length > 0` guard is
      # correctly written and would not have helped: a denominator only means anything
      # in a run that happens.
      #
      # Second instance of the same defect in one census, which is why the entries above
      # are wildcards and why this list is not being derived again.
      - "container/**"
      # The build job below runs the admin build, whose first step
      # (scripts/build-docs.mjs) resolves every docs-manifest entry to a file under
      # docs/public/. Both sides of that reference have to trigger the job that
      # checks the reference: a PR can break it by editing the manifest or by
      # deleting a doc it names. A deploy dispatch of 0069 died on exactly the
      # second case — the manifest still named a deleted doc, no PR check had ever
      # executed build-docs, and its first run anywhere was on the deploy runner.
      - "admin/**"
      - "docs/**"
  # No paths filter here, deliberately. Two lists are two things to keep in step, and
  # the first was already out of step: this file itself was missing from the push
  # list, so a change to the workflow could merge without main ever running it. The
  # distinction a paths filter encodes — which changes are worth testing — is not one
  # the property here cares about, which is only that the tree on main was tested.
  # Pushes to main are essentially merges, so the extra runs are few and cheap.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: worker-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  play-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test, typecheck, and bundle the private Play adapter
        env:
          HANDS_PLAY_ADAPTER_WORKER_NAME: hands-google-play-adapter-ci
          HANDS_PLAY_ALLOWED_PACKAGE_NAMES: build.raft.app
          HANDS_PLAY_CLOSED_TRACK_NAME: closed-ci
          HANDS_PLAY_MAX_AAB_SIZE_BYTES: "209715200"
        run: |
          pnpm --filter @botiverse/hands-play-adapter test
          pnpm --filter @botiverse/hands-play-adapter build
          node play-adapter/scripts/render-production-config.mjs \
            --output play-adapter/wrangler.generated.jsonc
          pnpm --filter @botiverse/hands-play-adapter exec wrangler deploy \
            --dry-run --strict --config wrangler.generated.jsonc

  windows-device-id:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @botiverse/hands-node build
      - name: Test real HKCU device identity persistence
        run: node packages/node/test/windows-device-id.mjs

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run the worker test suite
        working-directory: worker
        # One migration suite shells out to /usr/bin/sqlite3
        # (feedback_closure_reason_migration.test.ts); a machine without the CLI at
        # that path fails it with spawn ENOENT. That is a fact about the machine,
        # not the commit — this runner has sqlite3, so a local ENOENT red and a
        # green here are not in conflict, and the run bound to the commit is this
        # one.
        run: pnpm test

      # The type-check is deliberately not run here. `tsc` needs
      # worker-configuration.d.ts, which `wrangler types` generates from the rendered
      # production config, and that renderer validates its inputs against the real
      # checked-in route -- it refuses placeholder values by design. Making it accept
      # them to satisfy CI would weaken a production guard to buy a convenience, so
      # the type-check stays where the real config exists: the deploy workflow runs it
      # before every deploy.
      #
      # Naming the gap rather than leaving it implied: a type error can still reach
      # main and will surface at deploy time.

  # The deploy workflow's "Run checks" step builds the CLI (with its workspace
  # dependencies) and the admin app before touching production. Until this job
  # existed, deploy time was also the first time either build ran anywhere: PRs
  # ran only the worker suite above, and local green was evidence about a warm
  # node_modules, not about the commit. That bit twice in one day, from one
  # commit. A stale symlink kept `workspace:^0.1.0` resolving locally after the
  # range had stopped matching hands-node 0.3.0, so every local build was green
  # while a fresh `--frozen-lockfile` install — which is what the deploy runner
  # does — could not link the dependency at all; the next dispatch then found the
  # admin docs manifest naming a deleted file. This job is those same builds, same
  # filters, same order, on a fresh runner, at pull-request time.
  #
  # Deliberately absent: the worker build (`tsc --noEmit`). It needs
  # worker-configuration.d.ts generated from the rendered production config, and
  # the renderer refuses placeholder values by design — the note above this job
  # explains why that stays at deploy time. The gap this job closes is the
  # package builds; the type-check gap remains, and remains named.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build what the deploy builds
        # "..." builds workspace deps first (hands-cli depends on hands-node) —
        # mirrors deploy-hands-server.yml "Run checks" exactly, minus the worker
        # build explained above.
        run: |
          pnpm --filter @botiverse/hands-cli... build
          pnpm --filter @botiverse/hands-admin build

      - name: Pack and verify installed CLI device JSON commands
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hands-cli-pack"
          pnpm --dir packages/node pack --pack-destination "$RUNNER_TEMP/hands-cli-pack"
          pnpm --dir packages/cli pack --pack-destination "$RUNNER_TEMP/hands-cli-pack"
          cli_path="$(find "$RUNNER_TEMP/hands-cli-pack" -maxdepth 1 -name 'botiverse-hands-cli-*.tgz' -print -quit)"
          node_path="$(find "$RUNNER_TEMP/hands-cli-pack" -maxdepth 1 -name 'botiverse-hands-node-*.tgz' -print -quit)"
          test -n "${cli_path}"
          test -n "${node_path}"
          node packages/cli/test/installed-device-json.mjs "${cli_path}" "${node_path}"
