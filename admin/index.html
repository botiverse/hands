<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Hands</title>
    <script>
      // First-paint mode restore: mirrors raft-ui ThemeProvider's document
      // sync (the light/dark class) so the persisted mode applies before React
      // mounts, without a flash. Keep the key in sync with src/main.tsx
      // (`storageKey="hands-admin-mode"`).
      (function () {
        try {
          var mode = window.localStorage.getItem("hands-admin-mode");
          // Carry over the mode saved under the previous key.
          if (mode === null) {
            var previous = window.localStorage.getItem("hands-admin-theme-mode");
            if (previous === "light" || previous === "dark" || previous === "system") {
              mode = previous;
              window.localStorage.setItem("hands-admin-mode", mode);
            }
          }
          if (mode !== "light" && mode !== "dark" && mode !== "system") mode = "light";
          var resolved = mode;
          if (mode === "system") {
            resolved = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          var root = document.documentElement;
          root.classList.toggle("light", resolved === "light");
          root.classList.toggle("dark", resolved === "dark");
          root.style.colorScheme = resolved;
        } catch (error) {
          // localStorage unavailable: the ThemeProvider default applies once React mounts.
        }
      })();
    </script>
  </head>
  <body class="bg-layer-canvas text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
